<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MATH TEAM 3D</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background:
    radial-gradient(circle at center, #233b70, #080b20 75%);
  color: white;
  min-height: 100vh;
}

header {
  text-align: center;
  padding: 25px 10px;
}

h1 {
  font-size: clamp(32px, 5vw, 65px);
  color: #ffd36b;
  text-shadow: 0 0 25px #d58b27;
  margin: 10px;
}

.subtitle {
  font-size: 22px;
  color: #e8d7ac;
}

.doors {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 35px;
  flex-wrap: wrap;
  margin: 35px auto;
}

.door {
  width: 230px;
  height: 340px;
  border: 9px solid #d9a441;
  border-radius: 115px 115px 15px 15px;
  position: relative;
  cursor: pointer;
  box-shadow:
    0 0 25px var(--glow),
    inset 0 0 35px var(--glow);
  background:
    linear-gradient(135deg, #ffffff22, transparent 45%),
    var(--color);
  transition: transform .3s;
  overflow: hidden;
}

.door:hover {
  transform: scale(1.05);
}

.door::before {
  content: "";
  position: absolute;
  top: 75px;
  bottom: 0;
  left: 50%;
  width: 4px;
  background: #e9b95c;
  box-shadow: 0 0 15px gold;
}

.door::after {
  content: "✦";
  position: absolute;
  right: 25px;
  top: 185px;
  font-size: 30px;
  color: gold;
}

.door h2 {
  position: relative;
  text-align: center;
  font-size: 25px;
  margin-top: 80px;
  z-index: 2;
  text-shadow: 0 0 15px white;
}

.symbol {
  text-align: center;
  font-size: 75px;
  margin-top: 45px;
  text-shadow: 0 0 25px white;
}

.natural {
  --color: #075c35;
  --glow: #00ff88;
}

.integer {
  --color: #063a86;
  --glow: #00bfff;
}

.rational {
  --color: #5c148b;
  --glow: #d65cff;
}

.door.opening {
  animation: openDoor 2s ease forwards;
}

@keyframes openDoor {
  0% {
    transform: scale(1);
    filter: brightness(1);
  }
  40% {
    transform: perspective(600px) rotateY(-25deg);
    filter: brightness(1.8);
  }
  75% {
    transform: perspective(600px) rotateY(-55deg);
    filter: brightness(2.5);
  }
  100% {
    transform: scale(1.08);
    filter: brightness(3);
  }
}

.controls {
  text-align: center;
  padding: 20px;
}

button, select {
  padding: 14px 22px;
  margin: 7px;
  border-radius: 12px;
  border: 2px solid #dba94e;
  font-size: 18px;
}

button {
  cursor: pointer;
  background: linear-gradient(#8a5b21, #38200d);
  color: white;
  font-weight: bold;
}

button:hover {
  filter: brightness(1.3);
}

select {
  background: #fff;
  color: #111;
  max-width: 90%;
}

#result {
  text-align: center;
  min-height: 70px;
  font-size: clamp(23px, 4vw, 38px);
  color: #ffe38c;
  font-weight: bold;
  text-shadow: 0 0 15px #d59c36;
  padding: 15px;
}

.panel {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.94);
  z-index: 100;
  overflow-y: auto;
  padding: 25px;
}

.panel-content {
  max-width: 850px;
  margin: auto;
}

.panel h2 {
  color: #ffd36b;
}

textarea {
  width: 100%;
  height: 240px;
  background: #101a35;
  color: white;
  border: 2px solid gold;
  border-radius: 12px;
  padding: 15px;
  font-size: 17px;
}

.group-row {
  padding: 10px;
  border-bottom: 1px solid #ffffff33;
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
}

.group-row select {
  font-size: 14px;
  padding: 8px;
}

#finalGroups {
  max-width: 1000px;
  margin: 25px auto;
  display: none;
  gap: 15px;
  padding: 15px;
}

.group-card {
  flex: 1;
  min-width: 220px;
  background: #ffffff12;
  border: 2px solid #d8aa4d;
  border-radius: 18px;
  padding: 20px;
  text-align: center;
}

.group-card h3 {
  color: #ffdc83;
}

.group-card p {
  padding: 7px;
  background: #ffffff12;
  border-radius: 8px;
}

@media(max-width: 700px) {
  .door {
    width: 145px;
    height: 225px;
    border-width: 6px;
  }

  .door h2 {
    font-size: 16px;
    margin-top: 55px;
  }

  .symbol {
    font-size: 45px;
    margin-top: 25px;
  }

  .doors {
    gap: 15px;
  }

  #finalGroups {
    flex-direction: column;
  }
}
</style>
</head>

<body>

<header>
  <h1>👑 MATH TEAM 3D 👑</h1>
  <div class="subtitle">
    Топқа бөлу ойыны | 6-сынып
  </div>
</header>

<div class="controls">
  <select id="studentSelect">
    <option value="">Оқушыны таңдаңыз</option>
  </select>
</div>

<div class="doors">
  <div class="door natural" onclick="chooseDoor(this)">
    <h2>NATURAL</h2>
    <div class="symbol">ℕ</div>
  </div>

  <div class="door integer" onclick="chooseDoor(this)">
    <h2>INTEGER</h2>
    <div class="symbol">ℤ</div>
  </div>

  <div class="door rational" onclick="chooseDoor(this)">
    <h2>RATIONAL</h2>
    <div class="symbol">ℚ</div>
  </div>
</div>

<div id="result">
  Есіміңізді таңдап, сиқырлы есікті ашыңыз!
</div>

<div class="controls">
  <button onclick="startGame()">▶ Ойынды бастау</button>
  <button onclick="openTeacher()">🔐 Мұғалім панелі</button>
  <button onclick="showInstructions()">ℹ Нұсқаулық</button>
</div>

<div id="finalGroups"></div>

<div class="panel" id="teacherPanel">
  <div class="panel-content">
    <h2>🔐 Мұғалім панелі</h2>

    <p>Оқушылардың аты-жөнін әр жолға жеке енгізіңіз:</p>

    <textarea id="studentInput"></textarea>

    <h3>Оқушыларды топтарға бекіту</h3>

    <div id="assignmentList"></div>

    <button onclick="saveTeacher()">💾 Сақтау</button>
    <button onclick="resetGame()">🔄 Ойынды қайта бастау</button>
    <button onclick="closeTeacher()">✖ Жабу</button>
  </div>
</div>

<script>
const STORAGE_KEY = "mathTeam3D_v1";

const GROUPS = ["NATURAL", "INTEGER", "RATIONAL"];

const CAPACITY = {
  NATURAL: 6,
  INTEGER: 6,
  RATIONAL: 5
};

const DEFAULT_STUDENTS = [
  "Асылтай Ақнұр",
  "Әмзе Заңғар",
  "Бақыт Ерхан",
  "Бекболат Айару",
  "Джаркинбек Мейірлан",
  "Еркин Асылбек",
  "Есиркеп Алихан",
  "Ештай Жансая",
  "Камалбай Алдияр",
  "Марат Айкерім",
  "Мұсабек Томирис",
  "Нуркенбай Ерсұлтан",
  "Пазылхан Жұмағали",
  "Сабыров Ернар",
  "Сафила Нұрайым",
  "Сыздыкова Айжан",
  "Сырлыбай Нұрасыл"
];

const DEFAULT_FIXED = {
  "Есиркеп Алихан": "NATURAL",
  "Бекболат Айару": "NATURAL",
  "Нуркенбай Ерсұлтан": "NATURAL",

  "Бақыт Ерхан": "INTEGER",
  "Асылтай Ақнұр": "INTEGER",
  "Сабыров Ернар": "INTEGER",

  "Әмзе Заңғар": "RATIONAL",
  "Ештай Жансая": "RATIONAL",
  "Еркин Асылбек": "RATIONAL"
};

let students = [];
let fixed = {};
let assignments = {};
let completed = [];
let busy = false;
let gameStarted = false;

function loadData() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));

    if (saved && Array.isArray(saved.students)) {
      students = saved.students;
      fixed = saved.fixed || {};
      assignments = saved.assignments || {};
      completed = saved.completed || [];
      gameStarted = saved.gameStarted || false;
    } else {
      students = [...DEFAULT_STUDENTS];
      fixed = {...DEFAULT_FIXED};
      generateAssignments();
      saveData();
    }
  } catch (e) {
    students = [...DEFAULT_STUDENTS];
    fixed = {...DEFAULT_FIXED};
    generateAssignments();
    saveData();
  }

  renderStudents();
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    students,
    fixed,
    assignments,
    completed,
    gameStarted
  }));
}

function shuffle(array) {
  const a = [...array];

  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }

  return a;
}

function generateAssignments() {
  const result = {};
  const counts = {
    NATURAL: 0,
    INTEGER: 0,
    RATIONAL: 0
  };

  for (const name of students) {
    const group = fixed[name];

    if (GROUPS.includes(group)) {
      result[name] = group;
      counts[group]++;
    }
  }

  for (const group of GROUPS) {
    if (counts[group] > CAPACITY[group]) {
      alert(group + " тобында бекітілген оқушылар тым көп!");
      return false;
    }
  }

  const remaining = shuffle(
    students.filter(name => !result[name])
  );

  const available = [];

  for (const group of GROUPS) {
    const empty = CAPACITY[group] - counts[group];

    for (let i = 0; i < empty; i++) {
      available.push(group);
    }
  }

  if (available.length !== remaining.length) {
    alert("Оқушылар саны 17 болуы керек!");
    return false;
  }

  const shuffledGroups = shuffle(available);

  remaining.forEach((name, index) => {
    result[name] = shuffledGroups[index];
  });

  assignments = result;
  return true;
}

function renderStudents() {
  const select = document.getElementById("studentSelect");
  select.innerHTML =
    '<option value="">Оқушыны таңдаңыз</option>';

  students.forEach(name => {
    if (!completed.includes(name)) {
      const option = document.createElement("option");
      option.value = name;
      option.textContent = name;
      select.appendChild(option);
    }
  });

  if (completed.length === students.length && students.length) {
    showFinalGroups();
  }
}

function startGame() {
  if (!gameStarted) {
    if (!generateAssignments()) return;

    gameStarted = true;
    completed = [];
    saveData();
  }

  document.getElementById("result").textContent =
    "Оқушыны таңдап, қалаған есікті ашыңыз!";

  renderStudents();
}

function chooseDoor(door) {
  if (busy) return;

  if (!gameStarted) {
    alert("Алдымен «Ойынды бастау» батырмасын басыңыз!");
    return;
  }

  const select = document.getElementById("studentSelect");
  const name = select.value;

  if (!name) {
    alert("Алдымен оқушының есімін таңдаңыз!");
    return;
  }

  if (completed.includes(name)) return;

  const group = assignments[name];

  if (!group) {
    alert("Оқушының тобы анықталмады!");
    return;
  }

  busy = true;

  document.getElementById("result").textContent =
    "✨ Сиқырлы есік ашылып жатыр...";

  door.classList.add("opening");

  setTimeout(() => {
    door.classList.remove("opening");

    document.getElementById("result").textContent =
      "🎉 " + name + " — " + group + " тобы!";

    completed.push(name);
    saveData();

    select.value = "";
    renderStudents();

    busy = false;
  }, 2000);
}

function showFinalGroups() {
  const container = document.getElementById("finalGroups");

  container.style.display = "flex";
  container.innerHTML = "";

  GROUPS.forEach(group => {
    const card = document.createElement("div");
    card.className = "group-card";

    const title = document.createElement("h3");
    title.textContent = group;
    card.appendChild(title);

    students
      .filter(name => assignments[name] === group)
      .forEach(name => {
        const p = document.createElement("p");
        p.textContent = name;
        card.appendChild(p);
      });

    container.appendChild(card);
  });

  document.getElementById("result").textContent =
    "🏆 Барлық оқушы топтарға бөлінді!";
}

function openTeacher() {
  if (busy) return;

  const password = prompt("Мұғалім құпиясөзін енгізіңіз:");

  if (password !== "2026") {
    if (password !== null) alert("Құпиясөз қате!");
    return;
  }

  document.getElementById("teacherPanel").style.display = "block";
  document.getElementById("studentInput").value =
    students.join("\n");

  renderAssignmentList();
}

function closeTeacher() {
  document.getElementById("teacherPanel").style.display = "none";
}

function renderAssignmentList() {
  const container = document.getElementById("assignmentList");
  container.innerHTML = "";

  students.forEach(name => {
    const row = document.createElement("div");
    row.className = "group-row";

    const label = document.createElement("span");
    label.textContent = name;

    const select = document.createElement("select");
    select.dataset.name = name;

    [
      ["", "Автоматты"],
      ["NATURAL", "NATURAL"],
      ["INTEGER", "INTEGER"],
      ["RATIONAL", "RATIONAL"]
    ].forEach(([value, text]) => {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = text;
      select.appendChild(option);
    });

    select.value = fixed[name] || "";

    row.appendChild(label);
    row.appendChild(select);
    container.appendChild(row);
  });
}

function saveTeacher() {
  const newStudents = document
    .getElementById("studentInput")
    .value
    .split("\n")
    .map(s => s.trim())
    .filter(Boolean);

  if (newStudents.length !== 17) {
    alert("Дәл 17 оқушы енгізіңіз!");
    return;
  }

  if (new Set(newStudents).size !== 17) {
    alert("Оқушы есімдері қайталанбауы керек!");
    return;
  }

  const newFixed = {};

  document
    .querySelectorAll("#assignmentList select")
    .forEach(select => {
      if (select.value && newStudents.includes(select.dataset.name)) {
        newFixed[select.dataset.name] = select.value;
      }
    });

  const oldStudents = students;
  const oldFixed = fixed;
  const oldAssignments = assignments;

  students = newStudents;
  fixed = newFixed;

  if (!generateAssignments()) {
    students = oldStudents;
    fixed = oldFixed;
    assignments = oldAssignments;
    return;
  }

  completed = [];
  gameStarted = false;

  document.getElementById("finalGroups").style.display = "none";
  document.getElementById("result").textContent =
    "Есіміңізді таңдап, сиқырлы есікті ашыңыз!";

  saveData();
  renderStudents();
  closeTeacher();

  alert("Оқушылар мен топтар сақталды!");
}

function resetGame() {
  if (!confirm("Ойынды қайта бастаймыз ба?")) return;

  completed = [];
  gameStarted = false;

  if (!generateAssignments()) return;

  document.getElementById("finalGroups").style.display = "none";
  document.getElementById("result").textContent =
    "Есіміңізді таңдап, сиқырлы есікті ашыңыз!";

  saveData();
  renderStudents();

  alert("Ойын қайта бастауға дайын!");
}

function showInstructions() {
  alert(
    "MATH TEAM 3D\n\n" +
    "1. Ойынды бастау батырмасын басыңыз.\n" +
    "2. Оқушы өз есімін таңдайды.\n" +
    "3. Үш есіктің бірін ашады.\n" +
    "4. Жүйе оқушының тобын көрсетеді.\n" +
    "5. Келесі оқушы жалғастырады."
  );
}

loadData();
</script>

</body>
</html>
